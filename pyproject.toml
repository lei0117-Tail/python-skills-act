[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-executor"
version = "0.1.0"
description = "Standalone skill execution framework with LLM integration"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Skills Executor Contributors"}
]
keywords = ["ai", "agent", "llm", "skills", "tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic==2.12.5",
    "loguru==0.7.3",
    "typer>=0.9.0,<1.0.0",
    "rich==14.3.3",
    "openai==2.29.0",
    "httpx==0.28.1",
    "tiktoken==0.12.0",
    "json-repair==0.58.6",
    "python-dotenv>=1.0.0",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.6",
    "distro==1.9.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "idna==3.11",
    "jiter==0.13.0",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "regex==2026.2.28",
    "requests==2.32.5",
    "sniffio==1.3.1",
    "tqdm==4.67.3",
    "typing-inspection==0.4.2",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[project.scripts]
python-skill-bot = "skills_executor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skills_executor*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
